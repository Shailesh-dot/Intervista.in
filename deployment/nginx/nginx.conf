user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ── Increase buffer sizes for large headers (JWT tokens) ──────────────
    proxy_buffer_size        16k;
    proxy_buffers            4 32k;
    proxy_busy_buffers_size  64k;

    # ── Client body size (for file uploads) ───────────────────────────────
    client_max_body_size  50M;

    # ── Default proxy headers (inherited by all location blocks) ──────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen       80;
        server_name  _;

        # ── Health endpoint for DigitalOcean Load Balancer ────────────────
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # ── Frontend Static Files (React SPA) ─────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ══════════════════════════════════════════════════════════════════
        #  .NET C# APIs — pass-through (no prefix stripping)
        # ══════════════════════════════════════════════════════════════════

        # User API
        location /api/user {
            proxy_pass http://supabase-user-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # Company API
        location /api/company {
            proxy_pass http://supabase-company-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # Transaction API
        location /api/transaction {
            proxy_pass http://supabase-transaction-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Node.js Mail Server routes — pass-through (no prefix stripping)
        # ══════════════════════════════════════════════════════════════════

        location /api/send-verification {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        location /api/check-verification {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        location /api/verify {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        location /api/auth {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        location /api/contact {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        location /api/reset-password {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Node.js Data Service — strip /api/verification prefix
        # ══════════════════════════════════════════════════════════════════

        location /api/verification {
            rewrite ^/api/verification/(.*)$ /$1 break;
            rewrite ^/api/verification$ / break;
            proxy_pass http://data-service:5003;
            proxy_http_version 1.1;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python Coding Module — strip /api/coding prefix
        # ══════════════════════════════════════════════════════════════════

        location /api/coding {
            rewrite ^/api/coding/(.*)$ /$1 break;
            rewrite ^/api/coding$ / break;
            proxy_pass http://coding-service:8000;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python Interview Module — strip /api/interview prefix
        #  Supports WebSocket for potential real-time features
        # ══════════════════════════════════════════════════════════════════

        location /api/interview {
            rewrite ^/api/interview/(.*)$ /$1 break;
            rewrite ^/api/interview$ / break;
            proxy_pass http://interview-service:8001;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python Communication Module — strip /api/communication prefix
        # ══════════════════════════════════════════════════════════════════

        location /api/communication {
            rewrite ^/api/communication/(.*)$ /$1 break;
            rewrite ^/api/communication$ / break;
            proxy_pass http://communication-service:8002;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python/Flask Aptitude Module — strip /api/aptitude prefix
        # ══════════════════════════════════════════════════════════════════

        location /api/aptitude {
            rewrite ^/api/aptitude/(.*)$ /$1 break;
            rewrite ^/api/aptitude$ / break;
            proxy_pass http://aptitude-service:5000;
            proxy_http_version 1.1;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Node.js Screening Module — strip /api/screening prefix
        # ══════════════════════════════════════════════════════════════════

        location /api/screening {
            rewrite ^/api/screening/(.*)$ /$1 break;
            rewrite ^/api/screening$ / break;
            proxy_pass http://screening-service:5001;
            proxy_http_version 1.1;
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python Proctor — Face Verification — strip /api/proctor/face
        #  Extended timeouts + WebSocket/streaming support
        # ══════════════════════════════════════════════════════════════════

        location /api/proctor/face {
            rewrite ^/api/proctor/face/(.*)$ /$1 break;
            rewrite ^/api/proctor/face$ / break;
            proxy_pass http://face-proctor-service:8004;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # ══════════════════════════════════════════════════════════════════
        #  Python Proctor — Live Gaze Tracking — strip /api/proctor/live
        #  Extended timeouts + WebSocket/streaming support
        # ══════════════════════════════════════════════════════════════════

        location /api/proctor/live {
            rewrite ^/api/proctor/live/(.*)$ /$1 break;
            rewrite ^/api/proctor/live$ / break;
            proxy_pass http://live-proctor-service:8005;
            proxy_http_version 1.1;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
