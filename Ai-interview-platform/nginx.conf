user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        client_max_body_size 50M;

        # Docker internal DNS resolver for dynamic upstreams
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Health endpoint for DigitalOcean Load Balancer
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy"}';
        }

        # Frontend Static Files
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # C# Supabase User API
        location /api/user {
            proxy_pass http://supabase-user-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # C# Supabase Company API
        location /api/company {
            proxy_pass http://supabase-company-api:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Node.js Mail Server routes
        location /api/send-verification {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/check-verification {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /api/verify {
            proxy_pass http://mail-server:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Node Data Service (strip /api/verification)
        location /api/verification {
            rewrite ^/api/verification/(.*)$ /$1 break;
            rewrite ^/api/verification$ / break;
            proxy_pass http://data-service:5003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            client_max_body_size 50M;
        }

        # Python Coding microservice (strip /api/coding)
        location /api/coding {
            rewrite ^/api/coding/(.*)$ /$1 break;
            rewrite ^/api/coding$ / break;
            proxy_pass http://coding-service:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Python Interview technical module (strip /api/interview)
        location /api/interview {
            rewrite ^/api/interview/(.*)$ /$1 break;
            rewrite ^/api/interview$ / break;
            proxy_pass http://interview-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Python Communication module (strip /api/communication)
        location /api/communication {
            rewrite ^/api/communication/(.*)$ /$1 break;
            rewrite ^/api/communication$ / break;
            proxy_pass http://communication-service:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Python Aptitude session module (strip /api/aptitude)
        location /api/aptitude {
            rewrite ^/api/aptitude/(.*)$ /$1 break;
            rewrite ^/api/aptitude$ / break;
            proxy_pass http://aptitude-service:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Node.js Screening module (strip /api/screening)
        location /api/screening {
            rewrite ^/api/screening/(.*)$ /$1 break;
            rewrite ^/api/screening$ / break;
            set $screening_upstream "http://screening-service:5001";
            proxy_pass $screening_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Python Proctor Face tracking (strip /api/proctor/face)
        location /api/proctor/face {
            rewrite ^/api/proctor/face/(.*)$ /$1 break;
            rewrite ^/api/proctor/face$ / break;
            set $face_proctor_upstream "http://face-proctor-service:8004";
            proxy_pass $face_proctor_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # Python Proctor Live gaze tracking (strip /api/proctor/live)
        location /api/proctor/live {
            rewrite ^/api/proctor/live/(.*)$ /$1 break;
            rewrite ^/api/proctor/live$ / break;
            set $live_proctor_upstream "http://live-proctor-service:8005";
            proxy_pass $live_proctor_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
